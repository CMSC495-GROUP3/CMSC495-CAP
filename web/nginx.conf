server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Resolve the external client from X-Forwarded-For only when the immediate
    # peer is on the Compose edge network (Caddy). The official Nginx image
    # substitutes EDGE_SUBNET from the same Compose anchor used by IPAM. After
    # this, $remote_addr is the client
    # address Caddy recorded — not Caddy's container IP, and not a value an
    # external caller forged past Caddy (Caddy already replaced that).
    set_real_ip_from ${EDGE_SUBNET};
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # React SPA — any path not matching a real file falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/ requests to the FastAPI service.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, do not append. $remote_addr is the real_ip-resolved client
        # (see set_real_ip_from above). $proxy_add_x_forwarded_for would keep a
        # left-hand forgery if one ever reached this hop.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Disable buffering so SSE tokens reach the browser immediately.
        # The API also sends X-Accel-Buffering: no, but being explicit here
        # ensures it works regardless of header propagation.
        proxy_buffering off;
        proxy_cache off;
    }
}
