server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress the SPA shell and Vite bundles; text/html is always included
    # when gzip is on.
    gzip on;
    gzip_types application/javascript text/css application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Resolve the external client from X-Forwarded-For only when the immediate
    # peer is on Docker's default bridge address pools (Caddy on the edge
    # network). After this, $remote_addr is the client address Caddy recorded —
    # not Caddy's container IP, and not a value an external caller forged past
    # Caddy (Caddy already replaced that).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Location map (Wave 3 #88 baseline — proxy_read_timeout belongs ONLY in
    # location /api/; static locations below must stay free of proxy_*):
    #   = /index.html  — SPA shell; Cache-Control: no-cache; security headers
    #   /assets/       — Vite hashed bundles; immutable; try_files =404
    #   /              — SPA fallback try_files → /index.html
    #   /api/          — reverse proxy to FastAPI (SSE); sole proxy_* home

    # Vite's entry HTML must never be cached across deploys: a stale shell
    # references hashed assets the new container no longer has. add_header is
    # not inherited into a block that declares its own, so the security
    # headers are repeated here.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Content-hashed bundles under assets/ are immutable for a year. Missing
    # files return 404 (never the SPA HTML shell) so a stale reference fails
    # loudly instead of serving HTML as JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # React SPA — any path not matching a real file falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/ requests to the FastAPI service.
    #
    # A literal hostname in proxy_pass is resolved once, when Nginx loads its
    # config, and cached for the life of the worker. auto_deploy.sh recreates
    # the api container without restarting this one, and the new container
    # gets a new address, so that cache would leave every /api/ request on a
    # dead IP. A variable makes Nginx resolve through Docker's embedded DNS
    # (127.0.0.11) and refresh the answer every ten seconds.
    #
    # #88: raise proxy_read_timeout here only (default 60s breaks long SSE).
    # Do not add proxy_read_timeout to = /index.html, /assets/, or /.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, do not append. $remote_addr is the real_ip-resolved client
        # (see set_real_ip_from above). $proxy_add_x_forwarded_for would keep a
        # left-hand forgery if one ever reached this hop.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Disable buffering so SSE tokens reach the browser immediately.
        # The API also sends X-Accel-Buffering: no, but being explicit here
        # ensures it works regardless of header propagation.
        proxy_buffering off;
        proxy_cache off;
    }
}
