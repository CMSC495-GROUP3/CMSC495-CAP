# Weekly dependency update PRs, grouped so one PR per ecosystem lands on Monday
# rather than a dozen. Security advisories still open their own PR immediately.

version: 2
updates:
  # One entry covers every file under requirements/. Separate entries per
  # file produced duplicate PRs and, worse, one without the bcrypt exception.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies]
    ignore:
      # passlib 1.7.4 breaks on bcrypt 5.x; see requirements/api.txt.
      - dependency-name: bcrypt
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    ignore:
      # typescript-eslint pins typescript to <6.1.0, so npm ci refuses the
      # 7.x line. Drop this once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directories: [/, /web]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, infra]
