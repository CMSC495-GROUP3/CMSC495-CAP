name: Integration gap
description: Report a defect where two or more Sourcebook components do not work together as intended.
title: "integration: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for cross-component behavior that is individually valid
        but fails at an interface or handoff. Do not include credentials,
        password hashes, private policy text, or other sensitive data.

  - type: textarea
    id: observed_behavior
    attributes:
      label: Observed behavior
      description: What happens at the integration boundary and its impact.
      placeholder: When component A hands off to component B, ...
    validations:
      required: true

  - type: textarea
    id: affected_boundary
    attributes:
      label: Affected boundary and components
      description: Name both sides of the boundary and the interface between them.
      placeholder: Web client -> API /api/...; API -> provider; workflow -> deployment host; ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Smallest deterministic sequence that exposes the gap.
      placeholder: |
        1. Start ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: objective_evidence
    attributes:
      label: Objective evidence
      description: Optional sanitized logs, screenshots, response codes, or commit details.
      placeholder: Include the commit or branch and redact sensitive values.
    validations:
      required: false
