# Existing path-based labels applied to organization and fork pull requests by
# the "PR path labels" workflow. Missing labels are not created automatically.

api:
  - changed-files:
      - any-glob-to-any-file: ["policy_assistant/**", "Dockerfile"]

web:
  - changed-files:
      - any-glob-to-any-file: ["web/**"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**", "pyproject.toml"]

evaluation:
  - changed-files:
      - any-glob-to-any-file: ["evaluation/**", "policy_assistant/rag/evaluation.py"]

documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md"]

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", "Makefile", "pyproject.toml", "scripts/audit.sh"]

infra:
  - changed-files:
      - any-glob-to-any-file:
          - "docker-compose.yml"
          - "**/Dockerfile"
          - "**/nginx.conf"
          - "scripts/deploy.sh"
          - "scripts/auto_deploy.sh"
          - "scripts/systemd/**"
          - "Caddyfile"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "requirements/*.txt"
          - "web/package.json"
          - "web/package-lock.json"
