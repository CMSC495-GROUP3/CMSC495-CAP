# Path-based labels applied by the "PR checks" workflow on PRs from branches in
# this repository. Labels that do not exist yet are created on first use.

api:
  - changed-files:
      - any-glob-to-any-file: ["policy_assistant/**"]

web:
  - changed-files:
      - any-glob-to-any-file: ["web/**"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]

evaluation:
  - changed-files:
      - any-glob-to-any-file: ["evaluation/**", "policy_assistant/rag/evaluation.py"]

documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md"]

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", "Makefile", "pyproject.toml", "scripts/audit.sh"]

infra:
  - changed-files:
      - any-glob-to-any-file:
          - "docker-compose.yml"
          - "**/Dockerfile"
          - "**/nginx.conf"
          - "scripts/deploy.sh"
          - "Caddyfile"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "requirements/*.txt"
          - "web/package.json"
          - "web/package-lock.json"
