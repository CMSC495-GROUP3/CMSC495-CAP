# Applies path labels to organization and fork pull requests. This workflow
# receives a write-capable token through pull_request_target, so it must remain
# metadata-only: never check out, import, or execute pull-request content here.

name: PR path labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  labels:
    name: Labels by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/labeler reads the base branch's labeler configuration and the
      # pull request's changed-file metadata through the GitHub API. There is
      # intentionally no checkout or execution step.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          sync-labels: true
