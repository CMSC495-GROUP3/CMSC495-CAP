# Security scanning: static analysis, dependency advisories, and leaked secrets.
# Kept apart from CI so a new upstream advisory on a Monday morning does not
# block an unrelated PR; it fails this workflow, which someone then triages.
#
# Everything here runs on the public repo for free. CodeQL and dependency
# review need the repository to stay public or to have GitHub Advanced Security.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC, so new advisories surface weekly
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-audit:
    # scripts/audit.sh holds the accepted-advisory list; `make audit` runs it too.
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install pip-audit
      - run: ./scripts/audit.sh
        env:
          PIP_AUDIT: pip-audit

  dependency-review:
    # Flags a PR that adds a dependency with a known high-severity advisory or
    # an incompatible license, before it is merged.
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  secrets:
    # Full-history scan. GitHub's own secret scanning covers known token
    # formats; gitleaks also catches generic high-entropy strings, bcrypt
    # hashes, and connection strings with embedded passwords.
    name: Leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
