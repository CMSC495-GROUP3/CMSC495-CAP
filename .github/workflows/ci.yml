# Runs on every pull request and every push to main. Needs no secrets, so it
# runs on fork PRs too. `make check` runs the same test, lint, and build steps
# locally; the Docker and repo-check jobs are CI only.
#
# Branch protection should require the single "CI status" check rather than
# each job, so adding or renaming a job here never silently un-protects main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python-lint:
    name: Python lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Settings live in ruff.toml. `make fmt` fixes everything this reports.
      - run: ruff check --output-format github .
      - run: ruff format --check --diff .

  backend-tests:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what backend/Dockerfile ships; the others catch drift early.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r backend/requirements.txt -r requirements-dev.txt
      # Everything external is stubbed by tests/conftest.py: no database, no
      # model provider, no secrets needed.
      - name: Run the suite with coverage
        run: >
          python -m pytest
          --cov=backend --cov=src
          --cov-report=term --cov-report=xml
          --cov-fail-under=80
          --junitxml=junit.xml -o junit_family=legacy
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage (Python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results-py${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  evaluation-dataset:
    # The labeled question set in evaluation/ is data the tests depend on. This
    # job fails on its own, by name, when a PR breaks it, instead of leaving a
    # reviewer to find the reason inside the test log.
    name: Evaluation dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate the labeled question set
        # The loader has no third-party imports, so nothing is installed here.
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys
          from collections import Counter

          sys.path.insert(0, "src")
          from evaluation import load_cases

          cases = load_cases("evaluation/questions.json")
          counts = Counter(case["category"] for case in cases)
          print(f"## Evaluation dataset: {len(cases)} cases")
          print()
          print("| Category | Cases |")
          print("|---|---:|")
          for category, count in sorted(counts.items()):
              print(f"| {category} | {count} |")
          PY
          cat "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    # Both images build without secrets. The backend image is then imported
    # once, which catches a missing file or dependency in the image that the
    # test suite (which runs from the source tree) cannot.
    name: Docker images and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: policy-assistant-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: policy-assistant-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Backend image imports the application
        # pymongo connects lazily, so importing main needs no database. The
        # values are placeholders; nothing here is a real credential.
        run: >
          docker run --rm
          -e JWT_SECRET_KEY=ci-placeholder
          -e APP_PASSWORD_HASH=ci-placeholder
          -e MONGODB_URI=mongodb://127.0.0.1:1
          -e MONGODB_DB=ci
          -e LLM_PROVIDER=fake
          policy-assistant-backend:ci
          python -c "import main; print('backend image imports cleanly')"
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet

  repo-checks:
    name: Shell, Dockerfile, workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No secret or generated file is tracked
        run: |
          pattern='(^|/)\.env$|\.pem$|\.key$|(^|/)\.coverage$|coverage\.xml$|evaluation/results\.json$|(^|/)node_modules/|(^|/)dist/'
          if git ls-files | grep -E "$pattern"; then
            echo "::error::The files above must never be committed. See CONTRIBUTING.md."
            exit 1
          fi
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: hadolint (backend)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
      - name: hadolint (frontend)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
      - name: actionlint
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.7 -color

  ci-status:
    # The one check to require in branch protection.
    name: CI status
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - backend-tests
      - evaluation-dataset
      - frontend
      - docker
      - repo-checks
    if: always()
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled)"'; then
            exit 1
          fi
