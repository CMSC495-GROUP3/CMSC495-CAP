# Runs on every pull request and every push to main. Needs no secrets, so it
# runs on fork PRs too. `make check` runs the same test, lint, and build steps
# locally; the Docker and repo-check jobs are CI only.
#
# Branch protection should require the single "CI status" check rather than
# each job, so adding or renaming a job here never silently un-protects main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python-lint:
    name: Python lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/lint.txt
      - run: pip install -r requirements/lint.txt
      # Settings live in pyproject.toml. `make fmt` fixes everything this reports.
      - run: ruff check --output-format github .
      - run: ruff format --check --diff .

  python-tests:
    name: Python tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor pyproject.toml targets; the others catch drift
        # early and let a base-image bump be judged by a real test run.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      # Everything external is stubbed by tests/conftest.py: no database, no
      # model provider, no secrets needed.
      - name: Run the suite with coverage
        run: >
          python -m pytest
          --cov
          --cov-report=term --cov-report=xml
          --cov-fail-under=80
          --junitxml=junit.xml -o junit_family=legacy
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage (Python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-test-results-py${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  evaluation-dataset:
    # The labeled question set in evaluation/ is data the tests depend on. This
    # job fails on its own, by name, when a PR breaks it, instead of leaving a
    # reviewer to find the reason inside the test log.
    name: Evaluation dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate the labeled question sets
        # The loader has no third-party imports, so nothing is installed here.
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from collections import Counter

          from policy_assistant.rag.evaluation import EVALUATION_TIERS, load_cases

          print("## Evaluation datasets")
          print()
          for tier, path in sorted(EVALUATION_TIERS.items()):
              cases = load_cases(path)
              counts = Counter(case["category"] for case in cases)
              print(f"### {tier}: {len(cases)} cases (`{path.name}`)")
              print()
              print("| Category | Cases |")
              print("|---|---:|")
              for category, count in sorted(counts.items()):
                  print(f"| {category} | {count} |")
              print()
          PY
          cat "$GITHUB_STEP_SUMMARY"

  web:
    name: Web lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  docker:
    # Both images build without secrets. The API image is then imported
    # once, which catches a missing file or dependency in the image that the
    # test suite (which runs from the source tree) cannot.
    name: Docker images and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: policy-assistant-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: web
          file: web/Dockerfile
          push: false
          tags: policy-assistant-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: API image imports the application
        # pymongo connects lazily, so importing main needs no database. The
        # values are placeholders; nothing here is a real credential. main
        # checks the shape of APP_PASSWORD_HASH at import, so it is minted
        # inside the container rather than committed as a literal.
        run: >
          docker run --rm
          -e JWT_SECRET_KEY=ci-placeholder
          -e MONGODB_URI=mongodb://127.0.0.1:1
          -e MONGODB_DB=ci
          -e LLM_PROVIDER=fake
          policy-assistant-api:ci
          python -c "import bcrypt, os; os.environ['APP_PASSWORD_HASH'] = bcrypt.hashpw(b'ci', bcrypt.gensalt(4)).decode(); import policy_assistant.api.main; print('API image imports cleanly')"
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Full proxy-chain acceptance
        run: python scripts/test_proxy_chain.py

  repo-checks:
    name: Shell, Dockerfile, workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No secret or generated file is tracked
        run: |
          pattern='(^|/)\.env$|\.pem$|\.key$|(^|/)\.coverage$|coverage\.xml$|evaluation/results\.json$|(^|/)node_modules/|(^|/)dist/'
          if git ls-files | grep -E "$pattern"; then
            echo "::error::The files above must never be committed. See CONTRIBUTING.md."
            exit 1
          fi
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: auto_deploy synthetic checks
        run: bash scripts/test_auto_deploy.sh
      - name: hadolint (api)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: hadolint (web)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: web/Dockerfile
      - name: actionlint
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.7 -color

  ci-status:
    # The one check to require in branch protection.
    name: CI status
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - python-tests
      - evaluation-dataset
      - web
      - docker
      - repo-checks
    if: always()
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        # A job that does not run reports "skipped", which is not a failure
        # but is not a pass either. Require "success" from every job so a
        # skipped required job cannot turn this check green.
        run: |
          echo "$RESULTS"
          jq -e 'all(.[].result; . == "success")' <<< "$RESULTS" > /dev/null
