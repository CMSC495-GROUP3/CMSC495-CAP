# Python lint and format settings. `make lint`, `make fmt`, and CI all read this
# file, so a change here changes what gets merged.

target-version = "py311"   # matches backend/Dockerfile
line-length = 100
extend-exclude = [".venv", "frontend", "data"]

# The backend, the pipeline, and the stub each put their directory on sys.path
# and import each other by bare module name. Listing them here lets import
# sorting tell "our" modules apart from third-party ones.
src = [".", "src", "backend", "scripts/loadtest", "tests"]

[lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: syntax the target version supports
    "SIM",     # simplify
    "RUF",     # ruff's own checks
]
ignore = [
    "E501",  # the formatter wraps code; long strings and comments are allowed
    "B008",  # FastAPI's Depends() in a default argument is the framework idiom
]

[format]
docstring-code-format = true
