services:

  # TLS termination. Caddy obtains and renews a Let's Encrypt certificate for
  # SITE_ADDRESS and forwards everything to Nginx on the internal network. With
  # SITE_ADDRESS unset it serves plain HTTP on localhost, which is what
  # `make compose` uses.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. The volume must survive `docker compose down`,
      # which deploy.sh runs on every deploy; without it each deploy would
      # request a new certificate and run into Let's Encrypt's issuance limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      # Self-contained context — the build needs nothing from the parent
      context: web
      dockerfile: Dockerfile
    # Not published. Caddy reaches Nginx on port 80 over the Compose network.
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      # Root context so the image can copy the policy_assistant package
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Not published. Nginx proxies /api/ to this container on port 8000.
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
